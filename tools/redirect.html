<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Analytics 4 + Consent Mode -->
    <script src="../js/analytics-setup.js"></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9227354288966999"
        crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... — PickAI</title>

    <!-- Design System / CSS (linked from root) -->
    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:wght@400;600;700;900&display=swap"
        rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="manifest" href="../site.webmanifest">
    <style>
        .redirect-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: var(--space-md);
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.02) 0%, rgba(255, 255, 255, 1) 70%);
        }

        .redirect-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--color-border);
            padding: 40px 60px;
            border-radius: 2px;
            /* Editorial sharp/small radius */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--color-text-primary);
            border-radius: 50%;
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: var(--space-lg);
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: var(--color-highlight);
            margin-top: var(--space-lg);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--color-text-primary);
            animation: fillProgress 1.5s ease-out forwards;
        }

        @keyframes fillProgress {
            to {
                width: 100%;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .destination-name {
            font-family: var(--font-serif);
            font-weight: 700;
            color: var(--color-text-primary);
            border-bottom: 2px solid var(--color-highlight);
        }
    </style>
</head>

<body>

    <!-- 1. Editorial Header -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <a href="../index.html">PickAI.</a>
            </div>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">Tools</a></li>
                    <li><a href="../research.html">Research</a></li>
                    <li><a href="../opinion.html">Opinion</a></li>
                    <li><a href="../explainers.html">Explainers</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <!-- Search Icon placeholder / logic not strictly needed for redirect page but keeps layout consistent -->
            </div>
        </div>
    </header>

    <!-- 2. Main Content -->
    <main class="container">
        <div class="redirect-container">
            <div class="loader"></div>
            <h1 style="font-size: 2rem; margin-bottom: var(--space-md);">Leaving PickAI</h1>
            <p
                style="font-size: 1.1rem; color: var(--color-text-secondary); margin-bottom: var(--space-xl); max-width: 500px;">
                You are being redirected to <span id="tool-name" class="destination-name">external site</span>.
            </p>

            <p style="font-size: 0.9rem; color: var(--color-text-meta);">
                <a id="manual-link" href="#" style="text-decoration: underline;">Click here</a> if you are not
                redirected automatically.
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-brand">
                PickAI.
                <div class="meta-text" style="font-weight: normal; margin-top: 10px; font-size: 0.8rem;">
                    &copy; 2026 PickAI Media. <br> All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <!-- Redirect Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const targetUrl = params.get('url');
            const toolName = params.get('name');

            if (!targetUrl) {
                // Fallback if no URL provided
                document.querySelector('.redirect-container').innerHTML = `
                    <h1>Invalid Link</h1>
                    <p>No destination URL was specified.</p>
                    <a href="index.html" style="text-decoration:underline;">Return to Tools</a>
                `;
                return;
            }

            // Update UI
            if (toolName) {
                document.getElementById('tool-name').textContent = toolName;
                document.title = `Redirecting to ${toolName} — PickAI`;
            } else {
                document.getElementById('tool-name').textContent = 'external site';
            }

            const manualLink = document.getElementById('manual-link');
            manualLink.href = targetUrl;

            // Perform Redirect after delay
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1500); // 1.5 second delay to match animation
        });
    </script>

</body>

</html>
