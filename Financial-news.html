<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Analytics 4 + Consent Mode -->
    <script src="js/analytics-setup.js" defer></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9227354288966999"
        crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Reader — PickAI</title>

    <!-- Design System / CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/skeleton.css">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .reader-header {
            background: #fff;
            border-bottom: 1px solid var(--color-border);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .reader-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }

        .btn-external {
            background-color: var(--color-accent);
            color: #fff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-external:hover {
            background-color: var(--color-text-primary);
            color: #fff;
        }

        .reader-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 140px);
            /* Approx height removing header */
        }

        .news-frame-container {
            flex: 1;
            background: #f0f0f0;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .sidebar-ads {
            width: 320px;
            background: #fff;
            border-left: 1px solid var(--color-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            overflow-y: auto;
        }

        .ad-placeholder {
            width: 300px;
            height: 250px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            border: 1px dashed #ddd;
            font-size: 0.8rem;
        }

        @media (max-width: 900px) {
            .reader-layout {
                flex-direction: column;
                height: auto;
            }

            .sidebar-ads {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--color-border);
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px;
                gap: 10px;
            }

            .news-frame-container {
                height: 90vh;
                /* Increased for better reading */
            }

            /* Mobile Header Optimizations */
            .reader-controls {
                gap: 10px;
                padding: 0 15px;
                /* Ensure padding inside container */
            }

            .article-title {
                font-size: 0.9rem;
                max-width: 40%;
                /* Give more space to buttons */
            }

            .btn-external {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .btn-external span {
                display: none;
                /* Hide icon if needed */
            }
        }

        /* Extra small screens: Hide title, show only controls */
        @media (max-width: 400px) {
            .article-title {
                display: none;
            }

            .reader-controls {
                justify-content: space-between;
                width: 100%;
            }

            .btn-external::after {
                content: "";
                /* Removed redundant text */
            }

            .btn-external {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <!-- Simplified Header -->
    <header class="reader-header">
        <div class="container reader-controls">
            <a href="Financial.html"
                style="text-decoration: none; font-weight: 500; display:flex; align-items:center; gap:5px;">
                &larr; Back
            </a>
            <div class="article-title" id="page-title">Loading Article...</div>
            <a href="#" id="open-original" class="btn-external" target="_blank" rel="noopener noreferrer">
                Open Original <span>&nearr;</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="reader-layout">
        <!-- Iframe Area -->
        <div class="news-frame-container">
            <iframe id="news-frame" src=""></iframe>
        </div>

        <!-- Ad Sidebar -->
        <aside class="sidebar-ads">
            <!-- Ad Unit 1 -->
            <div class="ad-container">
                <span class="ad-label"
                    style="font-size: 0.7rem; color: #999; margin-bottom: 5px; display:block;">Advertisement</span>
                <!-- Google AdSense MPU -->
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px"
                    data-ad-client="ca-pub-9227354288966999" data-ad-slot="AUTO_GENERATED_ID"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

            <!-- Ad Unit 2 -->
            <div class="ad-container">
                <span class="ad-label"
                    style="font-size: 0.7rem; color: #999; margin-bottom: 5px; display:block;">Advertisement</span>
                <!-- Google AdSense MPU -->
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px"
                    data-ad-client="ca-pub-9227354288966999" data-ad-slot="AUTO_GENERATED_ID"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </aside>
    </div>

    <script>
        // Parse URL Parameters
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        const title = params.get('title');

        const frame = document.getElementById('news-frame');
        const titleEl = document.getElementById('page-title');
        const btn = document.getElementById('open-original');

        if (url) {
            frame.src = url;
            btn.href = url;
            // Handle loading error event for frame (minimal check)
            frame.onerror = function () {
                titleEl.textContent = "Unable to load here. Please open original.";
            };
        } else {
            document.body.innerHTML = '<div style="padding:40px; text-align:center;">Invalid Article Link. <a href="Financial.html">Go Back</a></div>';
        }

        if (title) {
            titleEl.textContent = title;
            document.title = `${title} — PickAI Reader`;
        }
    </script>

</body>

</html>
