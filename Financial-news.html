<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Google Analytics 4 + Consent Mode -->
    <script src="js/analytics-setup.js" defer></script>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9227354288966999"
        crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Redirect — PickAI</title>

    <!-- Design System / CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/skeleton.css">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Sidebar Injection (Manual Include for Safety) -->
    <div class="sidebar-overlay"></div>
    <aside class="sidebar-menu">
        <div class="sidebar-header">
            <div class="sidebar-brand">PickAI.</div>
            <button class="close-sidebar" aria-label="Close Menu">&times;</button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-search">
                <form action="./search.html" method="get">
                    <input type="text" name="q" placeholder="Search articles...">
                </form>
            </div>
            <div class="sidebar-topics">
                <h3>Browse by Topic</h3>
                <ul>
                    <li><a href="./tools/index.html">AI Tools</a></li>
                    <li><a href="./Financial.html">Financial</a></li>
                    <li><a href="./research.html">Research</a></li>
                    <li><a href="./opinion.html">Opinion</a></li>
                    <li><a href="./explainers.html">Explainers</a></li>
                    <li><a href="./redirect.html?to=https://jobs.pickai.com">Jobs</a></li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- Reader Header -->
    <header class="reader-header">
        <div class="container reader-controls">
            <a href="Financial.html" class="reader-back-link">
                &larr; Back to News
            </a>
            <div class="reader-page-title" id="header-title">Redirecting...</div>
            <span style="width: 80px;"></span> <!-- Spacer for balance -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="redirect-main">

        <div class="redirect-card">
            <div class="redirect-status">You are being redirected</div>
            <h1 class="redirect-title-preview" id="preview-title">Loading Article Info...</h1>

            <div class="timer-display">
                <div class="timer-number" id="timer">10</div>
                <div class="timer-label">Seconds Remaining</div>
            </div>

            <a href="#" id="manual-link" class="btn-primary"
                style="display: inline-block; width: auto; padding: 12px 32px; font-size: 1rem; text-decoration: none;">
                Open Article Now
            </a>
            <div style="margin-top: 15px; font-size: 0.8rem; color: var(--color-text-meta);">
                (Popup blocker may prevent automatic new tab)
            </div>
        </div>

        <!-- Ads Grid -->
        <div class="redirect-ads-grid">
            <!-- Ad Unit 1 -->
            <div class="ad-unit-clean">
                <span class="ad-unit-label">Advertisement</span>
                <!-- Google AdSense MPU -->
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px"
                    data-ad-client="ca-pub-9227354288966999" data-ad-slot="AUTO_GENERATED_ID"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
            <!-- Ad Unit 2 -->
            <div class="ad-unit-clean">
                <span class="ad-unit-label">Advertisement</span>
                <!-- Google AdSense MPU -->
                <ins class="adsbygoogle" style="display:inline-block;width:300px;height:250px"
                    data-ad-client="ca-pub-9227354288966999" data-ad-slot="AUTO_GENERATED_ID"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            const title = params.get('title');

            const headerTitle = document.getElementById('header-title');
            const previewTitle = document.getElementById('preview-title');
            const manualLink = document.getElementById('manual-link');
            const timerEl = document.getElementById('timer');

            // 1. Validation
            if (!url) {
                document.body.innerHTML = `
                    <div class="redirect-main">
                        <div class="redirect-card">
                            <h2>Invalid Link</h2>
                            <p>No article URL provided.</p>
                            <a href="Financial.html" class="btn-primary" style="margin-top:20px; display:inline-block;">Return to News</a>
                        </div>
                    </div>`;
                return;
            }

            // 2. Set Content
            if (title) {
                // Shorten title for header if needed
                headerTitle.textContent = title.length > 30 ? title.substring(0, 30) + '...' : title;
                previewTitle.textContent = title;
                document.title = `Redirecting to ${title} — PickAI`;
            } else {
                headerTitle.textContent = "External Article";
                previewTitle.textContent = "External Article";
            }

            manualLink.href = url;
            // Ensure manual click opens new tab as requested
            manualLink.target = "_blank";
            manualLink.rel = "noopener noreferrer";

            // 3. Countdown
            let timeLeft = 10;
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    timerEl.textContent = "0";
                    performRedirect();
                }
            }, 1000);

            // 4. Redirect Logic
            function performRedirect() {
                try {
                    const newWin = window.open(url, '_blank');
                    if (!newWin || newWin.closed || typeof newWin.closed == 'undefined') {
                        // Popup blocked.
                        timerEl.style.fontSize = "3rem";
                        timerEl.textContent = "Ready";
                        const label = document.querySelector('.timer-label');
                        if (label) label.textContent = "Click button below";

                        manualLink.style.transform = "scale(1.05)";
                        manualLink.style.transition = "transform 0.3s";
                    } else {
                        // Success - Opened in new tab.
                        timerEl.innerHTML = "&check;";
                        const label = document.querySelector('.timer-label');
                        if (label) label.textContent = "Opened in new tab";
                    }
                } catch (e) {
                    // Fallback
                    window.location.href = url;
                }
            }
        });
    </script>
    <script src="./js/hamburger.js"></script>
</body>

</html>
