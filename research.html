<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PickAI Research Journal</title>

    <!-- Global Design System -->
    <link rel="stylesheet" href="style.css">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:wght@400;600;700;900&display=swap"
        rel="stylesheet">

    <!-- JSON-LD BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://pickai.com/"
      },{
        "@type": "ListItem",
        "position": 2,
        "name": "Research",
        "item": "https://pickai.com/research.html"
      }]
    }
    </script>
</head>

<body>

    <!-- 1. Editorial Header -->
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo"><a href="index.html">PickAI.</a></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#news">AI News</a></li>
                    <li><a href="tools/index.html">Tools</a></li>
                    <li><a href="research.html" class="active">Research</a></li>
                    <li><a href="opinion.html">Opinion</a></li>
                    <li><a href="explainers.html">Explainers</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>
    </header>

    <!-- 2. Main Research Content -->
    <main class="container" style="padding-top: var(--space-2xl); padding-bottom: var(--space-3xl);">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" style="margin-top: 24px;">
            <a href="index.html">Home</a>
            <span class="separator">/</span>
            <span class="current">Research</span>
        </nav>

        <div class="section-header">
            <h1 style="font-size: 3rem; margin-bottom: var(--space-sm);">Research Journal</h1>
        </div>

        <div id="research-paper-list" class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-xl);">
            <!-- Papers Injected via JS -->
            <div class="text-center meta-text" style="grid-column: 1 / -1; padding: var(--space-2xl);">Loading
                Repository...</div>
        </div>

    </main>

    <!-- 3. Footer -->
    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-brand">
                PickAI.
                <div class="meta-text" style="font-weight: normal; margin-top: 10px; font-size: 0.8rem;">
                    &copy; 2026 PickAI Media. <br> All rights reserved.
                </div>
            </div>
        </div>
    </footer>

    <!-- Logic -->
    <script src="js/app.js"></script>

</body>

</html>
